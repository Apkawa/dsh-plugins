<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>image-editor dev</title>
    <style>
      body { margin: 0; font: 13px ui-sans-serif, system-ui, sans-serif; color: #1a1a1a; background: #f7f7f8; }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 12px; }
      #paste { border: 1px dashed #c9ced6; border-radius: 6px; padding: 8px; margin: 8px 0; color: #5b6268; }
      #editor { height: 480px; border: 1px solid #d8dbe0; border-radius: 6px; background: #ffffff; }
      #result { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
      #preview { max-width: 320px; border: 1px solid #d8dbe0; border-radius: 6px; }
      #export-info { color: #5b6268; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p>Load an image: <input id="file" type="file" accept="image/*" /> — or paste an image into the box.</p>
      <div id="paste" tabindex="0">paste image here</div>
      <div id="editor"></div>
      <div id="result">
        <img id="preview" alt="exported PNG preview" hidden />
        <p id="export-info">no export yet</p>
      </div>
    </div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
